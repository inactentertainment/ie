name: Install uploaded character portraits
on:
  push:
    paths:
      - '.github/workflows/install-character-portraits.yml'
      - 'productions/screenplays/the-lives-we-inherit/assets/characters/*.zip'
      - 'The_Lives_We_Inherit_Characters_21-25_Web_Ready.zip'
      - 'The_Lives_We_Inherit_Characters_11-20_Web_Ready.zip'
      - 'productions/screenplays/the-lives-we-inherit/assets/characters/The_Lives_We_Inherit_Characters_11-20_Web_Ready.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract verified individually named portraits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          base=Path("productions/screenplays/the-lives-we-inherit/assets/characters")
          sources=[
             base/"The_Lives_We_Inherit_Characters_01-10_Web_Ready.zip",
             Path("The_Lives_We_Inherit_Characters_21-25_Web_Ready.zip"),
             Path("The_Lives_We_Inherit_Characters_11-20_Web_Ready.zip"),
             base/"The_Lives_We_Inherit_Characters_11-20_Web_Ready.zip",
             base/"The_Lives_We_Inherit_Characters_21-25_Web_Ready.zip"
          ]
          import re
          count=0
          for source in sources:
              if not source.exists():
                  continue
              with ZipFile(source) as z:
                  for member in z.infolist():
                      name=Path(member.filename).name
                      if not re.fullmatch(r"character-(0[1-9]|1[0-9]|2[0-5])\.webp",name,re.I):
                          continue
                      number=int(name[10:12])
                      if source.name.endswith("01-10_Web_Ready.zip") and not 1<=number<=10: continue
                      if source.name.endswith("21-25_Web_Ready.zip") and not 21<=number<=25: continue
                      if source.name.endswith("11-20_Web_Ready.zip") and not 11<=number<=20: continue
                      data=z.read(member)
                      if len(data)<200 or data[:4]!=b"RIFF" or data[8:12]!=b"WEBP":
                          raise ValueError(f"Invalid WebP portrait: {member.filename}")
                      (base/f"character-{number:02}.webp").write_bytes(data)
                      count+=1
              print(f"Checked {source}")
          print(f"Extracted and validated {count} portraits")
          if any(source.exists() and source.name.endswith("11-20_Web_Ready.zip") for source in sources):
              if not all((base/f"character-{i:02}.webp").is_file() for i in range(11,21)):
                  raise SystemExit("Missing a portrait in 11–20 upload")
          if not all((base/f"character-{i:02}.webp").is_file() for i in range(21,26)):
              raise SystemExit("Missing a portrait in 21–25 upload; check ZIP contents")
          PY
      - name: Remove embedded picture frames from portraits 21 and 25
        shell: bash
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("productions/screenplays/the-lives-we-inherit/assets/characters")
          for number in (21,25):
              src=root/f"character-{number:02}.webp"
              with Image.open(src) as im:
                  im=im.convert("RGB")
                  w,h=im.size
                  left,right=int(w*.024),int(w*.024)
                  top,bottom=int(h*.028),int(h*.028)
                  crop=im.crop((left,top,w-right,h-bottom))
                  crop=crop.resize((900,1050),Image.Resampling.LANCZOS)
                  crop.save(src,"WEBP",quality=90,method=6)
                  print(f"Character {number}: removed source image frame, saved {crop.size}")
          PY
      - name: Commit individual character images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productions/screenplays/the-lives-we-inherit/assets/characters/character-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Install uploaded individual character portraits"
            git push
          fi
