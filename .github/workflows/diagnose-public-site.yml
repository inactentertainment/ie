name: Diagnose public main site (read-only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-public-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check custom domain, DNS and deployed paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "== GitHub Pages configuration =="
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ["html_url","status","cname","source","build_type","message"]})'
          for host in ieplr.com www.ieplr.com inactentertainment.github.io; do
            echo "== DNS ${host} =="
            getent ahostsv4 "${host}" | head -n 7
          done
          for url in "https://ieplr.com/" "https://ieplr.com/index.html" "https://ieplr.com/productions/screenplays/the-lives-we-inherit/" "https://inactentertainment.github.io/ie/"; do
            echo "== HTTP ${url} =="
            curl -LsS --max-time 16 -o /tmp/site-response -w 'final_url=%{url_effective} http=%{http_code} remote_ip=%{remote_ip} size=%{size_download}\n' "${url}"
            head -c 180 /tmp/site-response | tr '\n' ' '
            echo
          done
