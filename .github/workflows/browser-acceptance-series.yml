name: Browser acceptance - The Lives We Inherit
on:
  push:
    paths:
      - '.github/workflows/browser-acceptance-series.yml'
      - 'productions/screenplays/the-lives-we-inherit/index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Chromium automation
        run: |
          npm install --prefix /tmp/series-test playwright@1.58.2
          /tmp/series-test/node_modules/.bin/playwright install chromium
      - name: Probe 404 and domain redirect variants
        shell: bash
        run: |
          for url in \
             'https://ieplr.com/' \
             'http://ieplr.com/' \
             'https://www.ieplr.com/' \
             'http://www.ieplr.com/' \
             'https://ieplr.com/productions/screenplays/the-lives-we-inherit/' \
             'https://www.ieplr.com/productions/screenplays/the-lives-we-inherit/' \
             'https://ieplr.com/productions/screenplays/the-lives-we-inherit/story-brief.html' \
             'https://inactentertainment.github.io/ie/'; do
             curl -LsS --max-time 18 --retry 2 --retry-delay 1 -o /dev/null -w 'HTTP %{http_code}; final %{url_effective}; remote %{remote_ip}\n' "$url" || echo "ERROR $url"
          done
      - name: Test published series navigation, character viewer and inquiry
        env:
          NODE_PATH: /tmp/series-test/node_modules
        run: |
          cat >/tmp/series-test/check.cjs <<'JS'
          const { chromium }=require('playwright');
          const site='https://ieplr.com/productions/screenplays/the-lives-we-inherit/';
          const log=[];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const width of [1440,390]){
                const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const r=await page.goto(site,{waitUntil:'domcontentloaded',timeout:30000});
                if(r.status()!==200)throw Error('Page failed: '+r.status());
                await page.locator('#home .hero-actions [data-nav="explore"]').click();
                await page.locator('#explore:not([hidden])').waitFor();
                if(await page.locator('#explore .tiles, #explore .collection-end').count())throw Error('Duplicated tiles/footer callout remain');
                if((await page.locator('#explore .path-steps button').count())!==5)throw Error('Expected five movements');
                const menuStrings=await page.locator('#menuItems .nav-child').allInnerTexts();
                if(menuStrings.join('|')!=='Story|People|Episodes|Vision|Materials')throw Error('Menu differs: '+menuStrings);
                const layout=await page.locator('.path-steps button').evaluateAll(xs=>xs.map(x=>({x:Math.round(x.getBoundingClientRect().x),y:Math.round(x.getBoundingClientRect().y)})));
                if(width===390&&!layout.every((v,i)=>i===0||v.y>layout[i-1].y))throw Error('Five movements do not stack on mobile');
                if(width===1440&&!layout.every((v,i)=>i===0||Math.abs(v.y-layout[0].y)<4))throw Error('Five movements not in one desktop row');
                await page.locator('#explore .explore-back').click();
                await page.locator('#home:not([hidden])').waitFor();
                if((await page.locator('#home .hero-actions button').count())!==1)throw Error('Home still has duplicate Read the Story');
                await page.locator('#home .hero-actions [data-nav="explore"]').click();
                await page.locator('#explore:not([hidden])').waitFor();
                await page.locator('.path-steps [data-nav="characters"]').click();
                await page.locator('.cast-card').first().waitFor();
                if(!page.url().endsWith('#characters'))throw Error('Character section hash missing: '+page.url());
                await page.reload({waitUntil:'domcontentloaded'});
                await page.locator('.cast-card').first().waitFor();
                if((await page.locator('#detailTitle').innerText())!=='Characters')throw Error('Shared character URL did not survive refresh');
                if(await page.locator('footer a').count())throw Error('Unexpected footer link');

                const cards=await page.locator('.cast-card').count();
                if(cards!==25)throw Error('Expected 25 cards; found '+cards);
                await page.locator('.cast-card img').evaluateAll(xs=>xs.forEach(x=>x.loading='eager'));await page.waitForFunction(()=>Array.from(document.querySelectorAll('.cast-card img')).every(x=>x.complete),{timeout:25000});const broken=await page.locator('.cast-card img').evaluateAll(xs=>xs.map((x,i)=>x.naturalWidth===0?i+1:null).filter(Boolean));
                if(broken.length)throw Error('Portraits not loaded: '+broken.join(','));
                await page.locator('.cast-card').nth(20).click();
                await page.locator('#characterDialog[open]').waitFor();
                if(!(await page.locator('#characterDetailName').innerText()).includes('Enslaved Mother'))throw Error('Character 21 mismatched');
                await page.locator('#characterNext').click();
                if(!(await page.locator('#characterDetailName').innerText()).includes('Enslaved Father'))throw Error('Next character failed');
                await page.locator('#characterClose').click();
                if(await page.locator('#characterDialog').evaluate(x=>x.open))throw Error('Portrait viewer did not close');
                await page.locator('#menuBtn').click();
                if((await page.locator('#menuBtn').getAttribute('aria-expanded'))!=='true')throw Error('Nav did not open');
                await page.keyboard.press('Escape');
                if((await page.locator('#menuBtn').getAttribute('aria-expanded'))!=='false')throw Error('Escape did not close nav');
                await page.locator('#detail .back[data-nav="explore"]').click();
                await page.locator('.path-steps [data-nav="screenplays"]').click();
                const materialLinks=await page.locator('.screenplay-actions a.silver-action').evaluateAll(xs=>xs.map(x=>x.getAttribute('href')));
                if(materialLinks.length!==3)throw Error('Expected pitch deck, Bible and story');
                for(const href of materialLinks){const doc=await page.request.get(new URL(href,site).href);if(doc.status()!==200)throw Error('Material not published: '+href+' '+doc.status());}
                await page.locator('.materials-extra [data-nav="about"]').click();
                await page.locator('#inquiryForm').waitFor();
                if((await page.locator('#detailLead .creator-site-link').count())!==1)throw Error('Creator link missing');
                if(await page.locator('footer a[href="https://ieplr.com/"]').count())throw Error('Main-site link remains in footer');
                if(!page.url().endsWith('#about'))throw Error('Contact deep link missing');
                await page.reload({waitUntil:'domcontentloaded'});
                await page.locator('#inquiryForm').waitFor();
                if(!(await page.locator('#inquiryForm input[name="email"]').getAttribute('type')==='email'))throw Error('Email validation missing');
                const size=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:window.innerWidth}));
                if(size.scroll>size.width+3)throw Error('Horizontal overflow '+JSON.stringify(size));
                if(errors.length)throw Error('Browser JS errors: '+errors.join('; '));
                console.log('PASS: '+width+'px: 25 portraits, next/close viewer, menu escape, pitch documents, contact form, zero JS errors, no horizontal overflow');
                await page.close();
              }
              console.log('PASS: complete desktop/mobile browser checks');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/series-test/check.cjs

      - name: Final producer package checks - content, print output and responsive layout
        env:
          NODE_PATH: /tmp/series-test/node_modules
        run: |
          cat >/tmp/series-test/producer-check.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://ieplr.com/productions/screenplays/the-lives-we-inherit/';
          const files = [
            ['producer-pitch-deck.html',13,'slide'],
            ['series-bible.html',12,'chapter'],
            ['story-brief.html',6,'presentation-section']
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const width of [1440,390]){
                const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const res=await page.goto(base+'#explore',{waitUntil:'domcontentloaded'});
                if(res.status()!==200)throw Error('Explore URL '+res.status());
                await page.locator('#explore:not([hidden])').waitFor();
                if(await page.locator('.path-label').count())throw Error('Old five movements label remains');
                const gap=await page.evaluate(()=>{
                  const buttons=document.querySelector('.path-steps').getBoundingClientRect();
                  const footer=document.querySelector('footer').getBoundingClientRect();
                  return {gap:Math.round(footer.top-buttons.bottom),width:window.innerWidth,scroll:document.documentElement.scrollWidth};
                });
                if(gap.gap>100)throw Error('Footer gap too large: '+JSON.stringify(gap));
                if(gap.scroll>gap.width+3)throw Error('Explore horizontal overflow '+JSON.stringify(gap));
                console.log('PASS Explore '+width+'px: button-footer gap '+gap.gap+'px');
                for(const [name,expectedCount,css] of files){
                  const response=await page.goto(base+name,{waitUntil:'domcontentloaded'});
                  if(response.status()!==200)throw Error(name+' HTTP '+response.status());
                  const title=await page.title();
                  if(!title.includes('The Lives We Inherit'))throw Error(name+' missing project title');
                  if(await page.locator('meta[name="robots"]').getAttribute('content')!=='noindex,nofollow')throw Error(name+' missing noindex');
                  const text=await page.locator('body').innerText();
                  if(name==='producer-pitch-deck.html'){
                    if((await page.locator('.slide').count())!==expectedCount)throw Error('Pitch count mismatch');
                    if(!text.includes('Full teleplays')||!text.includes('development'))throw Error('Pitch does not describe development stage');
                  }
                  if(name==='series-bible.html'){
                    if((await page.locator('.chapter').count())!==expectedCount)throw Error('Bible chapter count mismatch');
                    if(!text.includes('Unresolved material')||!text.includes('Historical standards'))throw Error('Bible missing honest development caveats');
                  }
                  if(name==='story-brief.html' && !text.includes('Six-Chapter Structure'))throw Error('Story brief incomplete');
                  const size=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:innerWidth}));
                  if(size.scroll>size.width+3)throw Error(name+' mobile overflow '+JSON.stringify(size));
                  if(width===1440){
                    const pdf=await page.pdf({format:'Letter',printBackground:true,preferCSSPageSize:true});
                    if(pdf.length<4500)throw Error(name+' PDF export unexpectedly small');
                    if(pdf.subarray(0,4).toString()!=='%PDF')throw Error(name+' print output invalid');
                    console.log('PASS '+name+' print PDF '+Math.round(pdf.length/1024)+'KiB');
                  }
                  console.log('PASS '+name+' '+width+'px');
                }
                if(errors.length)throw Error('JS errors: '+errors.join('; '));
                await page.close();
              }
              console.log('PASS: final producer package responsive and print checks');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/series-test/producer-check.cjs
