name: Nine-Site Free Access QA
on:
  pull_request:
    paths:
      - '.github/scripts/nine-site-smoke-audit.cjs'
      - '.github/workflows/nine-site-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify smoke test syntax
        run: node --check .github/scripts/nine-site-smoke-audit.cjs
      - name: Inspect nine repositories without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/nine-site-smoke-audit.cjs
