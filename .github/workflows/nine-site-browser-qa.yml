name: Nine-site Browser Release QA
on:
  pull_request:
    paths:
      - 'qa/browser-smoke.cjs'
      - '.github/workflows/nine-site-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check browser test syntax
        run: node --check qa/browser-smoke.cjs
      - name: Test nine development site branches
        run: node qa/browser-smoke.cjs
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-site-browser-smoke
          path: qa/browser-smoke-results/
          retention-days: 14
